<style>
    .top-nav {
        width: 100%;
        min-height: 88px;
        padding: 14px 4%;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;

        background: #050b10;
        border-bottom: 1px solid #17434c;
        position: relative;
        z-index: 100;
    }

    .nav-side {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .nav-left {
        justify-content: flex-start;
    }

    .nav-right {
        justify-content: flex-end;
    }

    .nav-icon {
        position: relative;
        width: 48px;
        height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;

        background: #0b2027;
        border: 1px solid #123c43;
        border-radius: 13px;
        color: #00f5d4;
        text-decoration: none;

        transition:
            background 0.25s ease,
            border-color 0.25s ease,
            box-shadow 0.25s ease,
            transform 0.25s ease;
    }

    .nav-icon svg {
        width: 23px;
        height: 23px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .nav-icon:hover,
    .nav-icon:focus-visible {
        background: #00f5d4;
        color: #031014;
        border-color: #00f5d4;
        box-shadow: 0 0 18px #00f5d455;
        transform: translateY(-2px);
        outline: none;
    }

    /* TOOLTIP */
    .nav-icon::after {
        content: attr(data-tooltip);
        position: absolute;
        top: calc(100% + 10px);
        left: 50%;
        transform: translate(-50%, -4px);

        padding: 6px 10px;
        border: 1px solid #17434c;
        border-radius: 7px;
        background: #0b171e;
        color: #00f5d4;

        font-family: Arial, sans-serif;
        font-size: 12px;
        white-space: nowrap;

        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: 0.2s ease;
    }

    .nav-icon:hover::after,
    .nav-icon:focus-visible::after {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, 0);
    }

    /* CENTER TITLE */
    .brand-title {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        text-decoration: none;
        white-space: nowrap;
    }

    .brand-title span {
        color: #00f5d4;
        font-family: Arial, sans-serif;
        font-size: clamp(17px, 2vw, 27px);
        font-weight: 900;
        letter-spacing: 2px;
        text-shadow: 0 0 12px #00f5d455;
    }

    .brand-title small {
        margin-top: 5px;
        color: #78969e;
        font-family: Arial, sans-serif;
        font-size: 9px;
        letter-spacing: 2px;
    }

    /* MOBILE */
    @media (max-width: 620px) {
        .top-nav {
            padding: 12px;
            gap: 8px;
            min-height: 74px;
        }

        .nav-side {
            gap: 6px;
        }

        .nav-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
        }

        .nav-icon svg {
            width: 19px;
            height: 19px;
        }

        .brand-title span {
            font-size: 14px;
            letter-spacing: 1px;
        }

        .brand-title small {
            font-size: 7px;
            letter-spacing: 1px;
        }
    }

    @media (max-width: 390px) {
        .top-nav {
            padding: 10px 7px;
            gap: 5px;
        }

            gap: 4px;
        }

        .nav-icon {
            width: 31px;
            height: 34px;
        }

        .brand-title span {

            letter-spacing: 0.5px;
        }
    }
</style>
