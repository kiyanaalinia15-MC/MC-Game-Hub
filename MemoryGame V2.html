

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Memory Game V2</title>



  <style>

    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }



    body {

      min-height: 100vh;

      padding: 25px 15px;

      background: #050b10;

      color: #eaffff;

      font-family: Arial, sans-serif;

      text-align: center;

    }



    h1 {

      color: #00f5d4;

      font-size: clamp(28px, 5vw, 44px);

      margin-bottom: 12px;

      text-shadow: 0 0 15px #00f5d477;

    }



    h2 {

      color: #00f5d4;

      margin-bottom: 18px;

    }



    .screen {

      width: 100%;

      max-width: 750px;

      margin: 25px auto;

      padding: 25px 18px;

      border: 1px solid #00f5d477;

      border-radius: 18px;

      background: #0b171e;

      box-shadow: 0 0 25px #00f5d41c;

    }



    .hidden {

      display: none !important;

    }



    .subtitle {

      color: #a9c6c8;

      margin-bottom: 22px;

      line-height: 1.6;

    }



    .option-group {

      display: flex;

      flex-wrap: wrap;

      justify-content: center;

      gap: 12px;

      margin: 18px 0 25px;

    }



    button {

      border: 1px solid #00f5d4;

      border-radius: 10px;

      background: #10252d;

      color: #eaffff;

      padding: 12px 18px;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;

    }



    button:hover {

      background: #00f5d4;

      color: #041014;

      box-shadow: 0 0 16px #00f5d477;

      transform: translateY(-2px);

    }



    button.selected {

      background: #00f5d4;

      color: #041014;

      box-shadow: 0 0 15px #00f5d477;

    }



    .primary-btn {

      background: #00f5d4;

      color: #041014;

    }



    .back-btn {

      border-color: #8ca7ad;

      color: #c4d4d8;

      background: #15232a;

    }



    .game-info {

      display: grid;

      grid-template-columns: repeat(2, minmax(0, 1fr));

      gap: 10px;

      max-width: 700px;

      margin: 20px auto;

    }



    .info-box {

      padding: 13px 8px;

      border: 1px solid #00f5d455;

      border-radius: 10px;

      background: #0b171e;

    }



    .info-label {

      display: block;

      color: #8ddddd;

      font-size: 12px;

      margin-bottom: 7px;

    }



    .info-value {

      color: #00f5d4;

      font-size: 21px;

      font-weight: bold;

    }



    .scoreboard {

      display: grid;

      grid-template-columns: repeat(2, minmax(0, 1fr));

      gap: 12px;

      max-width: 700px;

      margin: 15px auto;

    }



    .score-card {

      padding: 14px 8px;

      border: 1px solid #00f5d455;

      border-radius: 12px;

      background: #0b171e;

    }



    .score-card.active {

      border-color: #00f5d4;

      box-shadow: 0 0 14px #00f5d433;

    }



    .score-name {

      font-size: 14px;

      color: #c6dfe0;

      margin-bottom: 8px;

    }



    .score-number {

      color: #00f5d4;

      font-size: 28px;

      font-weight: bold;

    }



    #turnDisplay {

      min-height: 24px;

      margin: 15px 0;

      color: #00f5d4;

      font-weight: bold;

    }



    #gameBoard {

      display: grid;

      grid-template-columns: repeat(var(--columns), minmax(0, 1fr));

      gap: 6px;

      width: 90%;

      max-width: 650px;

      margin: 20px auto;

    }



    .card {

      aspect-ratio: 1 / 1;

      display: flex;

      justify-content: center;

      align-items: center;

      min-width: 0;

      border: 1px solid #00f5d477;

      border-radius: 8px;

      background: linear-gradient(145deg, #12303a, #0a171d);

      color: #00f5d4;

      font-size: clamp(14px, 3.2vw, 30px);

      cursor: pointer;

      user-select: none;

      transition: 0.2s;

    }



    .card:hover:not(.revealed):not(.matched):not(.empty) {

      border-color: #00f5d4;

      box-shadow: 0 0 10px #00f5d455;

    }



    .card.revealed {

      background: #173d46;

      border-color: #00f5d4;

    }



    .card.matched {

      background: #0b392f;

      border-color: #26d98b;

      color: #8affc5;

      cursor: default;

    }



    .card.empty {

      visibility: hidden;

      cursor: default;

      border: 0;

      background: transparent;

    }



    .controls {

      display: flex;

      flex-wrap: wrap;

      justify-content: center;

      gap: 10px;

      margin: 22px auto;

    }



    #resultMessage {

      margin: 20px auto;

      color: #00f5d4;

      font-size: 22px;

      font-weight: bold;

      line-height: 1.5;

    }



    @media (max-width: 480px) {

      body {

        padding: 18px 8px;

      }



      .screen {

        padding: 20px 10px;

      }



      #gameBoard {

        width: 100%;

        gap: 4px;

      }



      .card {

        border-radius: 5px;

      }



      button {

        padding: 10px 12px;

        font-size: 13px;

      }

    }

  
/* Achievement toast */
#achievementToast{position:fixed;z-index:9999;left:50%;top:22px;width:min(420px,calc(100vw - 28px));padding:16px 18px;transform:translate(-50%,-160%);opacity:0;border:1px solid #00f5d4;border-radius:16px;background:linear-gradient(135deg,#0b2425,#071012);color:#efffff;box-shadow:0 0 24px #00f5d455,inset 0 0 18px #00f5d40d;text-align:left;pointer-events:none;transition:transform .35s ease,opacity .35s ease}
#achievementToast.show{transform:translate(-50%,0);opacity:1}
#achievementToast .achievement-kicker{color:#00f5d4;font-size:11px;font-weight:900;letter-spacing:2px;margin-bottom:5px}
#achievementToast .achievement-title{font-size:17px;font-weight:900;margin-bottom:4px}
#achievementToast .achievement-desc{color:#a9c6c8;font-size:12px;line-height:1.5}
</style>

</head>



<body>

  <h1>🧠 Memory Game V2</h1>



  <!-- Setup screen -->

  <section id="setupScreen" class="screen">

    <h2>Choose Game Mode</h2>

    <p class="subtitle">Select how you want to play.</p>



    <div class="option-group">

      <button id="singleBtn" class="selected" type="button">

        👤 Single Player

      </button>

      <button id="twoPlayerBtn" type="button">

        👥 Play With Friend

      </button>

    </div>



    <h2>Choose Board Size</h2>

    <div class="option-group">

      <button class="size-btn selected" data-size="5" type="button">5 × 5</button>

      <button class="size-btn" data-size="6" type="button">6 × 6</button>

      <button class="size-btn" data-size="7" type="button">7 × 7</button>

      <button class="size-btn" data-size="8" type="button">8 × 8</button>

    </div>



    <p class="subtitle" id="boardDescription">

      5 × 5 board — 24 active cards and 1 empty space.

    </p>



    <button id="startBtn" class="primary-btn" type="button">

      Start Game

    </button>



    <div class="controls">

      <button class="back-btn" id="setupBackBtn" type="button">

        ← Back to MC Game Hub

      </button>

    </div>

  </section>



  <!-- Game screen -->

  <section id="gameScreen" class="hidden">

    <div class="game-info">

      <div class="info-box">

        <span class="info-label">MODE</span>

        <span class="info-value" id="modeValue">Single</span>

      </div>

      <div class="info-box">

        <span class="info-label">MOVES</span>

        <span class="info-value" id="movesValue">0</span>

      </div>

      <div class="info-box">

        <span class="info-label">PAIRS LEFT</span>

        <span class="info-value" id="pairsValue">0</span>

      </div>

      <div class="info-box">

        <span class="info-label">TIME</span>

        <span class="info-value" id="timeValue">00:00</span>

      </div>

    </div>



    <div id="scoreboard" class="scoreboard">

      <div class="score-card active" id="player1Card">

        <div class="score-name" id="player1Label">Player 1</div>

        <div class="score-number" id="player1Score">0</div>

      </div>

      <div class="score-card" id="player2Card">

        <div class="score-name">Player 2</div>

        <div class="score-number" id="player2Score">0</div>

      </div>

    </div>



    <div id="turnDisplay">Player 1's turn</div>



    <div id="gameBoard"></div>



    <div id="resultMessage" aria-live="polite"></div>



    <div class="controls">

      <button id="restartBtn" type="button">🔄 Restart Game</button>

      <button id="settingsBtn" type="button">⚙️ Change Settings</button>

      <button id="gameBackBtn" class="back-btn" type="button">

        ← Back to MC Game Hub

      </button>

    </div>

  </section>



  <div id="achievementToast" role="status" aria-live="polite"><div class="achievement-kicker">🏆 ACHIEVEMENT UNLOCKED</div><div class="achievement-title" id="achievementToastTitle">Achievement</div><div class="achievement-desc" id="achievementToastDesc">New achievement unlocked!</div></div>
<script>



const setupScreen = document.getElementById("setupScreen");

const gameScreen = document.getElementById("gameScreen");

const singleBtn = document.getElementById("singleBtn");

const twoPlayerBtn = document.getElementById("twoPlayerBtn");

const sizeButtons = document.querySelectorAll(".size-btn");

const boardDescription = document.getElementById("boardDescription");



const gameBoard = document.getElementById("gameBoard");

const modeValue = document.getElementById("modeValue");

const movesValue = document.getElementById("movesValue");

const pairsValue = document.getElementById("pairsValue");

const timeValue = document.getElementById("timeValue");

const turnDisplay = document.getElementById("turnDisplay");

const resultMessage = document.getElementById("resultMessage");



const player1Label = document.getElementById("player1Label");

const player1Score = document.getElementById("player1Score");

const player2Score = document.getElementById("player2Score");

const player1Card = document.getElementById("player1Card");

const player2Card = document.getElementById("player2Card");



const boardSettings = {

  5: { totalCells: 25, activeCards: 24 },

  6: { totalCells: 36, activeCards: 36 },

  7: { totalCells: 49, activeCards: 48 },

  8: { totalCells: 64, activeCards: 64 }

};



const symbols = [

  "🍎", "🍌", "🍇", "🍉", "🍒", "🍓", "🍍", "🥝",

  "🍋", "🥑", "🍕", "🍔", "🍟", "🌮", "🍩", "🍪",

  "⚽", "🏀", "🎮", "🎲", "🚀", "🌟", "🌈", "🔥",

  "🐱", "🐶", "🦊", "🐼", "🦁", "🐸", "🦄", "🐧"

];



const USERS_KEY = "mc_game_hub_users";

const CURRENT_USER_KEY = "mc_current_user";

const MEMORY_XP_REWARD = 25;



let selectedMode = "single";

let selectedSize = 5;

let cards = [];

let firstCard = null;

let secondCard = null;

let lockBoard = false;

let moves = 0;

let matchedPairs = 0;

let totalPairs = 0;

let scores = [0, 0];

let currentPlayer = 0;

let gameFinished = false;

let startTime = 0;

let timerInterval = null;

let elapsedSeconds = 0;



// جلوگیری از ثبت دوبارهٔ پاداش برای یک بازی

let rewardGranted = false;



singleBtn.addEventListener("click", () => {

  selectedMode = "single";

  singleBtn.classList.add("selected");

  twoPlayerBtn.classList.remove("selected");

  updateBoardDescription();

});



twoPlayerBtn.addEventListener("click", () => {

  selectedMode = "two";

  twoPlayerBtn.classList.add("selected");

  singleBtn.classList.remove("selected");

  updateBoardDescription();

});



sizeButtons.forEach(button => {

  button.addEventListener("click", () => {

    selectedSize = Number(button.dataset.size);



    sizeButtons.forEach(item => item.classList.remove("selected"));

    button.classList.add("selected");



    updateBoardDescription();

  });

});



function updateBoardDescription() {

  const setting = boardSettings[selectedSize];

  const pairs = setting.activeCards / 2;

  const empty = setting.totalCells - setting.activeCards;



  boardDescription.textContent =

    `${selectedSize} × ${selectedSize} board — ${pairs} pairs` +

    (empty ? ` and ${empty} empty space.` : ".");

}



document.getElementById("startBtn").addEventListener("click", startGame);

document.getElementById("restartBtn").addEventListener("click", startGame);



document.getElementById("settingsBtn").addEventListener("click", () => {

  stopTimer();

  gameScreen.classList.add("hidden");

  setupScreen.classList.remove("hidden");

});



document.getElementById("setupBackBtn").addEventListener("click", goToHub);

document.getElementById("gameBackBtn").addEventListener("click", goToHub);



function goToHub() {

  window.location.href = "index.html";

}



// --------------------------------------------------

// MC GAME HUB V3: ذخیرهٔ XP در حساب کاربری فعلی

// --------------------------------------------------



// MC GAME HUB: Achievement system (IDs match Profile V4)
const ACHIEVEMENTS = [
 {id:"first_memory",title:"Memory Rookie",description:"Complete your first Memory Game.",test:u=>(Number(u.memoryWins)||0)>=1},
 {id:"memory_10",title:"Memory Master",description:"Complete 10 Memory Game wins.",test:u=>(Number(u.memoryWins)||0)>=10},
 {id:"first_rps",title:"First Victory",description:"Win your first RPS round against the AI.",test:u=>(Number(u.rpsWins)||0)>=1},
 {id:"rps_10",title:"RPS Champion",description:"Win 10 RPS rounds against the AI.",test:u=>(Number(u.rpsWins)||0)>=10},
 {id:"level_2",title:"Level Up!",description:"Reach Level 2.",test:u=>(Number(u.level)||1)>=2},
 {id:"level_5",title:"Rising Legend",description:"Reach Level 5.",test:u=>(Number(u.level)||1)>=5},
 {id:"level_10",title:"Hub Legend",description:"Reach Level 10.",test:u=>(Number(u.level)||1)>=10},
 {id:"snake_10",title:"Snake Starter",description:"Score at least 10 in Snake.",test:u=>(Number(u.snakeBest)||0)>=10},
 {id:"snake_50",title:"Snake Expert",description:"Score at least 50 in Snake.",test:u=>(Number(u.snakeBest)||0)>=50},
 {id:"points_100",title:"Point Collector",description:"Reach 100 total points.",test:u=>(Number(u.totalPoints)||0)>=100},
 {id:"coins_100",title:"Coin Collector",description:"Collect 100 coins.",test:u=>(Number(u.coins)||0)>=100},
 {id:"all_rounder",title:"All-Rounder",description:"Win Memory and RPS, and score 10 in Snake.",test:u=>(Number(u.memoryWins)||0)>=1&&(Number(u.rpsWins)||0)>=1&&(Number(u.snakeBest)||0)>=10},
 {id:"games_3",title:"Explorer",description:"Unlock at least 3 games.",test:u=>Array.isArray(u.unlockedGames)&&u.unlockedGames.length>=3}
];
let achievementToastQueue=[]; let achievementToastBusy=false;
function showAchievementToast(item){
 achievementToastQueue.push(item); if(achievementToastBusy)return;
 const next=()=>{const a=achievementToastQueue.shift();if(!a){achievementToastBusy=false;return;} achievementToastBusy=true;
 const toast=document.getElementById("achievementToast"),title=document.getElementById("achievementToastTitle"),desc=document.getElementById("achievementToastDesc");
 if(!toast||!title||!desc){achievementToastBusy=false;return;} title.textContent=a.title;desc.textContent=a.description;toast.classList.add("show");
 setTimeout(()=>{toast.classList.remove("show");setTimeout(next,400);},3000);}; next();
}
function syncAchievements(user){if(!Array.isArray(user.achievements))user.achievements=[];const fresh=[];for(const a of ACHIEVEMENTS){if(!user.achievements.includes(a.id)&&a.test(user)){user.achievements.push(a.id);fresh.push(a);}}return fresh;}
function notifyAchievements(items){items.forEach((item,index)=>setTimeout(()=>showAchievementToast(item),index*3500));}

function awardMemoryXP() {

  // فقط بازی تک‌نفره XP می‌دهد.

  if (selectedMode !== "single" || rewardGranted) {

    return false;

  }



  try {

    const username = localStorage.getItem(CURRENT_USER_KEY);



    if (!username) {

      resultMessage.textContent +=

        " | Log in to MC Game Hub to earn XP.";

      return false;

    }



    const users = JSON.parse(localStorage.getItem(USERS_KEY) || "[]");



    if (!Array.isArray(users)) {

      throw new Error("Invalid users data");

    }



    const userIndex = users.findIndex(

      user => user.username === username

    );



    if (userIndex === -1) {

      resultMessage.textContent +=

        " | Account not found. Please log in again.";

      return false;

    }



    const user = users[userIndex];



    // پشتیبانی از حساب‌های قدیمی که فیلد XP نداشتند

    user.xp = Math.max(0, Number(user.xp) || 0);

    user.level = Math.max(1, Number(user.level) || 1);

    user.memoryWins = Math.max(0, Number(user.memoryWins) || 0);

    user.totalPoints = Math.max(0, Number(user.totalPoints) || 0);



    // فقط پس از پایان کامل بازی اجرا می‌شود

    user.xp += MEMORY_XP_REWARD;

    user.memoryWins += 1;



    // محاسبهٔ Level بر اساس مجموع XP

    // Level 1: نیازمند 100 XP

    // Level 2: نیازمند 200 XP بیشتر

    // Level 3: نیازمند 300 XP بیشتر و به همین ترتیب

    let remainingXP = user.xp;

    let newLevel = 1;



    while (remainingXP >= newLevel * 100) {

      remainingXP -= newLevel * 100;

      newLevel++;

    }



    user.level = newLevel;
    const newlyUnlocked = syncAchievements(user);

    users[userIndex] = user;
    localStorage.setItem(USERS_KEY, JSON.stringify(users));

    notifyAchievements(newlyUnlocked);
    rewardGranted = true;



    resultMessage.textContent +=

      ` | +${MEMORY_XP_REWARD} XP earned! Level ${user.level}`;



    return true;

  } catch (error) {

    console.error("Could not save Memory Game XP:", error);



    resultMessage.textContent +=

      " | XP could not be saved. Please try again.";



    return false;

  }

}



function startGame() {

  stopTimer();



  setupScreen.classList.add("hidden");

  gameScreen.classList.remove("hidden");



  moves = 0;

  matchedPairs = 0;

  scores = [0, 0];

  currentPlayer = 0;

  firstCard = null;

  secondCard = null;

  lockBoard = false;

  gameFinished = false;

  elapsedSeconds = 0;

  rewardGranted = false;



  const setting = boardSettings[selectedSize];

  totalPairs = setting.activeCards / 2;



  modeValue.textContent =

    selectedMode === "single" ? "Single" : "2 Players";



  movesValue.textContent = "0";

  pairsValue.textContent = totalPairs;

  timeValue.textContent = "00:00";

  resultMessage.textContent = "";



  player1Label.textContent =

    selectedMode === "single" ? "Your Score" : "Player 1";



  player1Score.textContent = "0";

  player2Score.textContent = "0";



  player2Card.classList.toggle("hidden", selectedMode === "single");



  updateTurnDisplay();

  createBoard(setting);



  startTime = Date.now();

  timerInterval = setInterval(updateTimer, 1000);

}



function createBoard(setting) {

  gameBoard.innerHTML = "";

  gameBoard.style.setProperty("--columns", selectedSize);



  const chosenSymbols = symbols.slice(0, totalPairs);

  const deck = [...chosenSymbols, ...chosenSymbols];



  while (deck.length < setting.totalCells) {

    deck.push(null);

  }



  for (let i = deck.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [deck[i], deck[j]] = [deck[j], deck[i]];

  }



  cards = [];



  deck.forEach((symbol, index) => {

    const card = document.createElement("button");

    card.type = "button";

    card.className = "card";



    if (symbol === null) {

      card.classList.add("empty");

      card.disabled = true;

      card.setAttribute("aria-hidden", "true");

    } else {

      card.textContent = "?";

      card.dataset.symbol = symbol;

      card.dataset.index = index;

      card.addEventListener("click", () => flipCard(card));

    }



    gameBoard.appendChild(card);

    cards.push(card);

  });

}



function flipCard(card) {

  if (

    lockBoard ||

    gameFinished ||

    card.classList.contains("revealed") ||

    card.classList.contains("matched") ||

    card.classList.contains("empty")

  ) {

    return;

  }



  card.textContent = card.dataset.symbol;

  card.classList.add("revealed");



  if (!firstCard) {

    firstCard = card;

    return;

  }



  secondCard = card;

  moves++;

  movesValue.textContent = moves;

  lockBoard = true;



  if (firstCard.dataset.symbol === secondCard.dataset.symbol) {

    handleMatch();

  } else {

    setTimeout(handleMismatch, 850);

  }

}



function handleMatch() {

  firstCard.classList.remove("revealed");

  secondCard.classList.remove("revealed");

  firstCard.classList.add("matched");

  secondCard.classList.add("matched");



  matchedPairs++;

  scores[currentPlayer]++;

  updateScores();



  pairsValue.textContent = totalPairs - matchedPairs;



  firstCard = null;

  secondCard = null;

  lockBoard = false;



  if (matchedPairs === totalPairs) {

    finishGame();

  } else {

    updateTurnDisplay();

  }

}



function handleMismatch() {

  firstCard.textContent = "?";

  secondCard.textContent = "?";

  firstCard.classList.remove("revealed");

  secondCard.classList.remove("revealed");



  firstCard = null;

  secondCard = null;

  lockBoard = false;



  if (selectedMode === "two") {

    currentPlayer = currentPlayer === 0 ? 1 : 0;

  }



  updateTurnDisplay();

}



function updateScores() {

  player1Score.textContent = scores[0];

  player2Score.textContent = scores[1];

}



function updateTurnDisplay() {

  if (selectedMode === "single") {

    turnDisplay.textContent = "Find all the matching pairs!";

    player1Card.classList.add("active");

    player2Card.classList.remove("active");

    return;

  }



  turnDisplay.textContent = `Player ${currentPlayer + 1}'s turn`;

  player1Card.classList.toggle("active", currentPlayer === 0);

  player2Card.classList.toggle("active", currentPlayer === 1);

}



function finishGame() {

  if (gameFinished) return;



  gameFinished = true;

  lockBoard = true;

  stopTimer();



  if (selectedMode === "single") {

    resultMessage.textContent =

      `🎉 Great job! You found all ${totalPairs} pairs!`;



    // پاداش فقط یک‌بار و بعد از پایان بازی

    awardMemoryXP();

  } else if (scores[0] > scores[1]) {

    resultMessage.textContent =

      `🏆 Player 1 Wins! (${scores[0]} - ${scores[1]})`;

  } else if (scores[1] > scores[0]) {

    resultMessage.textContent =

      `🏆 Player 2 Wins! (${scores[1]} - ${scores[0]})`;

  } else {

    resultMessage.textContent =

      `🤝 It's a Draw! (${scores[0]} - ${scores[1]})`;

  }



  resultMessage.scrollIntoView({

    behavior: "smooth",

    block: "center"

  });

}



function updateTimer() {

  if (gameFinished) return;



  elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);



  const minutes = String(

    Math.floor(elapsedSeconds / 60)

  ).padStart(2, "0");



  const seconds = String(elapsedSeconds % 60).padStart(2, "0");



  timeValue.textContent = `${minutes}:${seconds}`;

}



function stopTimer() {

  if (timerInterval !== null) {

    clearInterval(timerInterval);

    timerInterval = null;

  }

}



updateBoardDescription();



  </script>

</body>

</html>
