<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MC Game Hub V2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}


/* =========================
   BODY
========================= */

body{
    background:#050505;
    font-family:'Orbitron',Tahoma,sans-serif;
    color:white;
    overflow-x:hidden;
}


/* =========================
   BACKGROUND
========================= */

body::before{

    content:"";

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:

    radial-gradient(
        circle at top,
        rgba(0,255,255,.08),
        transparent 40%
    ),

    radial-gradient(
        circle at bottom,
        rgba(0,255,255,.05),
        transparent 50%
    );

    z-index:-2;
}


body::after{

    content:"";

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background-image:

    linear-gradient(
        rgba(0,255,255,.03) 1px,
        transparent 1px
    ),

    linear-gradient(
        90deg,
        rgba(0,255,255,.03) 1px,
        transparent 1px
    );

    background-size:45px 45px;

    animation:gridMove 15s linear infinite;

    z-index:-1;
}


@keyframes gridMove{

    0%{
        transform:translateY(0);
    }

    100%{
        transform:translateY(45px);
    }

}


/* =========================
   HEADER
========================= */

header{

    width:100%;

    padding:12px 70px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    position:sticky;

    top:0;

    backdrop-filter:blur(12px);

    background:rgba(0,0,0,.45);

    border-bottom:2px solid turquoise;

    box-shadow:
    0 0 20px rgba(64,224,208,.35);

    z-index:999;

}


/* =========================
   LOGO TEXT
========================= */

.logo{

    font-size:38px;

    font-weight:bold;

    letter-spacing:3px;

    color:turquoise;

    text-shadow:

    0 0 10px turquoise,
    0 0 20px turquoise,
    0 0 40px turquoise;

}


/* =========================
   MAIN IMAGE LOGO
========================= */

.logo-area{

    display:flex;

    align-items:center;

    justify-content:center;

}


.main-logo{

    width:95px;

    height:80px;

    object-fit:contain;

    display:block;

    filter:

    drop-shadow(
        0 0 5px rgba(64,224,208,.5)
    )

    drop-shadow(
        0 0 12px rgba(64,224,208,.25)
    );

    transition:.35s;

}


.main-logo:hover{

    transform:scale(1.08);

    filter:

    drop-shadow(
        0 0 10px turquoise
    )

    drop-shadow(
        0 0 20px rgba(64,224,208,.6)
    );

}


/* =========================
   NAVIGATION
========================= */

nav{

    display:flex;

    gap:35px;

}


nav a{

    text-decoration:none;

    color:white;

    font-size:18px;

    transition:.35s;

    cursor:pointer;

}


nav a:hover{

    color:turquoise;

    text-shadow:
    0 0 15px turquoise;

}
