
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Game Hub | Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 24px 14px;
            display: flex;
            align-items: center;
            justify-content: center;

            background: #050b10;
            color: white;
            font-family: Arial, sans-serif;
        }

        .account-card {
            width: 100%;
            max-width: 430px;
            padding: 30px;
            background: #0b171e;
            border: 1px solid #17434c;
            border-radius: 20px;
            box-shadow: 0 0 30px #00f5d411;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand a {
            color: #00f5d4;
            text-decoration: none;
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 12px #00f5d444;
        }

        .brand p {
            color: #829da5;
            margin-top: 9px;
            font-size: 13px;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 24px;
        }

        .tab {
            padding: 12px 8px;
            background: #071117;
            color: #91a8af;
            border: 1px solid #17434c;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        .tab.active {
            color: #031014;
            background: #00f5d4;
            border-color: #00f5d4;
        }

        .form-title {
            margin-bottom: 20px;
            font-size: 23px;
            text-align: center;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #b8cbd0;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #050b10;
            color: white;
            border: 1px solid #24444d;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #00f5d4;
            box-shadow: 0 0 10px #00f5d422;
        }

        .main-btn {
            width: 100%;
            margin-top: 5px;
            padding: 14px;
            background: #00f5d4;
            color: #031014;
            border: 0;
            border-radius: 9px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 900;
            transition: 0.2s;
        }

        .main-btn:hover {
            box-shadow: 0 0 20px #00f5d455;
            transform: translateY(-1px);
        }

        .secondary-btn {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            background: transparent;
            color: #00f5d4;
            border: 1px solid #00f5d4;
            border-radius: 9px;
            cursor: pointer;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .message.success {
            display: block;
            color: #00f5d4;
            background: #00f5d410;
            border: 1px solid #00f5d455;
        }

        .message.error {
            display: block;
            color: #ff9292;
            background: #ff404010;
            border: 1px solid #ff404055;
        }

        .hidden {
            display: none !important;
        }

        .account-info {
            text-align: center;
            padding: 18px 0;
        }

        .account-info h2 {
            color: #00f5d4;
            margin-bottom: 12px;
        }

        .account-info p {
            color: #b8cbd0;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            color: #829da5;
            text-align: center;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: #00f5d4;
        }

        @media (max-width: 450px) {
            .account-card {
                padding: 22px 17px;
            }
        }
    </style>
</head>

<body>

<main class="account-card">

    <div class="brand">
        <a href="index.html">MC GAME HUB</a>
        <p>Play • Compete • Win</p>
    </div>


    <!-- LOGGED-IN VIEW -->
    <section id="loggedInView" class="hidden">
        <div class="account-info">
            <h2>Welcome back!</h2>
            <p id="welcomeText"></p>
            <p id="accountStats"></p>
        </div>

        <button class="main-btn" id="goHomeBtn">
            Continue to Game Hub
        </button>

        <button class="secondary-btn" id="logoutBtn">
            Log Out
        </button>
    </section>


    <!-- AUTH VIEW -->
    <section id="authView">

        <div class="tabs">
            <button class="tab active" id="loginTab" type="button">
                Login
            </button>

            <button class="tab" id="registerTab" type="button">
                Register
            </button>
        </div>


        <!-- LOGIN FORM -->
        <form id="loginForm">

            <h1 class="form-title">Welcome Back</h1>

            <div class="field">
                <label for="loginEmail">Email</label>
                <input
                    id="loginEmail"
                    type="email"
                    autocomplete="email"
                    required
                    maxlength="254"
                    placeholder="you@example.com">
            </div>

            <div class="field">
                <label for="loginPassword">Password</label>
                <input
                    id="loginPassword"
                    type="password"
                    autocomplete="current-password"
                    required
                    placeholder="Enter your password">
            </div>

            <button class="main-btn" type="submit">
                Login
            </button>

        </form>


        <!-- REGISTER FORM -->
        <form id="registerForm" class="hidden">

            <h1 class="form-title">Create Account</h1>

            <div class="field">
                <label for="registerUsername">Username</label>
                <input
                    id="registerUsername"
                    type="text"
                    autocomplete="username"
                    required
                    minlength="3"
                    maxlength="20"
                    pattern="[A-Za-z0-9_]+"
                    title="Use 3–20 letters, numbers, or underscores."
                    placeholder="Your username">
            </div>

            <div class="field">
                <label for="registerEmail">Email</label>
                <input
                    id="registerEmail"
                    type="email"
                    autocomplete="email"
                    required
                    maxlength="254"
                    placeholder="you@example.com">
            </div>

            <div class="field">
                <label for="registerPassword">Password</label>
                <input
                    id="registerPassword"
                    type="password"
                    autocomplete="new-password"
                    required
                    minlength="8"
                    maxlength="128"
                    placeholder="At least 8 characters">
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    id="confirmPassword"
                    type="password"
                    autocomplete="new-password"
                    required
                    minlength="8"
                    maxlength="128"
                    placeholder="Repeat your password">
            </div>

            <button class="main-btn" type="submit">
                Create Account
            </button>

        </form>


        <div id="message" class="message" role="status"
             aria-live="polite"></div>

    </section>


    <a class="back-link" href="index.html">
        ← Back to MC Game Hub
    </a>

</main>


<script>
    const USERS_KEY = "mc_game_hub_users";
    const CURRENT_USER_KEY = "mc_current_user";

    const authView = document.getElementById("authView");
    const loggedInView = document.getElementById("loggedInView");

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");

    const message = document.getElementById("message");


    function getUsers() {
        try {
            const data = localStorage.getItem(USERS_KEY);
            const users = data ? JSON.parse(data) : [];

            return Array.isArray(users) ? users : [];
        } catch {
            showMessage(
                "Could not read saved accounts. Check browser storage.",
                "error"
            );

            return [];
        }
    }


    function saveUsers(users) {
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }


    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }


    function clearMessage() {
        message.textContent = "";
        message.className = "message";
    }


    function showLogin() {
        loginForm.classList.remove("hidden");
        registerForm.classList.add("hidden");

        loginTab.classList.add("active");
        registerTab.classList.remove("active");

        clearMessage();
    }


    function showRegister() {
        registerForm.classList.remove("hidden");
        loginForm.classList.add("hidden");

        registerTab.classList.add("active");
        loginTab.classList.remove("active");

        clearMessage();
    }


    function getCurrentUser() {
        const username = localStorage.getItem(CURRENT_USER_KEY);

        if (!username) {
            return null;
        }

        return getUsers().find(
            user => user.username === username
        ) || null;
    }


    function showAccount(user) {
        authView.classList.add("hidden");
        loggedInView.classList.remove("hidden");

        document.getElementById("welcomeText").textContent =
            "You are logged in as " + user.username + ".";

        document.getElementById("accountStats").textContent =
            "Coins: " + (user.coins || 0) +
            " | Total Points: " + (user.totalPoints || 0);
    }


    function showAuth() {
        loggedInView.classList.add("hidden");
        authView.classList.remove("hidden");
    }


    registerForm.addEventListener("submit", function(event) {
        event.preventDefault();
        clearMessage();

        const username =
            document.getElementById("registerUsername").value.trim();

        const email =
            document.getElementById("registerEmail").value.trim().toLowerCase();

        const password =
            document.getElementById("registerPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {
            showMessage(
                "Username must be 3–20 characters using letters, numbers, or underscores.",
                "error"
            );
            return;
        }

        if (password.length < 8 || password.length > 128) {
            showMessage(
                "Password must be between 8 and 128 characters.",
                "error"
            );
            return;
        }

        if (password !== confirmPassword) {
            showMessage(
                "The passwords do not match.",
                "error"
            );
            return;
        }

        const users = getUsers();

        if (users.some(user =>
            user.username.toLowerCase() === username.toLowerCase()
        )) {
            showMessage("That username is already taken.", "error");
            return;
        }

        if (users.some(user => user.email === email)) {
            showMessage("An account with this email already exists.", "error");
            return;
        }


        /*
          IMPORTANT:
          This is a local prototype only.
          Passwords in LocalStorage are NOT secure.
          Do not use real or reused passwords here.
        */

        const newUser = {
            username: username,
            email: email,
            password: password,

            memoryWins: 0,
            rpsWins: 0,
            snakeBest: 0,

            totalPoints: 0,
            coins: 0,

            unlockedGames: [],

            createdAt: new Date().toISOString()
        };


        try {
            users.push(newUser);
            saveUsers(users);

            localStorage.setItem(CURRENT_USER_KEY, username);

            showAccount(newUser);
        } catch {
            showMessage(
                "Could not save the account. Browser storage may be full or blocked.",
                "error"
            );
        }
    });


    loginForm.addEventListener("submit", function(event) {
        event.preventDefault();
        clearMessage();

        const email =
            document.getElementById("loginEmail").value.trim().toLowerCase();

        const password =
            document.getElementById("loginPassword").value;


        const user = getUsers().find(
            account =>
                account.email === email &&
                account.password === password
        );


        if (!user) {
            showMessage(
                "Incorrect email or password.",
                "error"
            );
            return;
        }


        localStorage.setItem(CURRENT_USER_KEY, user.username);

        showAccount(user);
    });


    document.getElementById("logoutBtn").addEventListener("click", function() {
        localStorage.removeItem(CURRENT_USER_KEY);

        showAuth();
        showLogin();
        loginForm.reset();

        showMessage("You have logged out.", "success");
    });


    document.getElementById("goHomeBtn").addEventListener("click", function() {
        window.location.href = "index.html";
    });


    loginTab.addEventListener("click", showLogin);
    registerTab.addEventListener("click", showRegister);


    /*
      Read ?mode=register or ?mode=login
      from the top navigation links.
    */

    const requestedMode =
        new URLSearchParams(window.location.search).get("mode");


if (requestedMode === "profile") {
    const currentUser = getCurrentUser();

    if (currentUser) {
        showAccount(currentUser);
    } else {
        showAuth();
        showLogin();
    }
} else if (requestedMode === "register") {
    showRegister();
} else {
    showLogin();
}


    /*
      If already logged in, show the account view.
    */

    const currentUser = getCurrentUser();

    if (currentUser) {
        showAccount(currentUser);
    } else {
        showAuth();
    }
</script>

</body>
</html>
